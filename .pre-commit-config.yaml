repos:
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: uv run pylint src
        language: system
        types: [python]
        pass_filenames: false
      - id: pylint-tests
        name: pylint (tests)
        entry: uv run pylint tests --disable=missing-function-docstring,redefined-outer-name,too-few-public-methods,too-many-arguments,too-many-positional-arguments
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff
        name: ruff
        entry: uv run ruff check .
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
